<style>
:root {
  --bg: #f2f2f7;
  --land: #ffffff;
  --land-stroke: #d8d8de;
  --seoul: #ffe9d6;
  --seoul-stroke: #f0b787;
  --sea: #e8eef6;
  --label: #000;
  --label2: rgba(60,60,67,.6);
  --label3: rgba(60,60,67,.3);
  --fill: rgba(118,118,128,.12);
  --sheet: rgba(255,255,255,.82);
  --cell: #fff;
  --sep: rgba(60,60,67,.18);
  --pin: #007aff;
  --season: #ff6b00;
  --season-soft: rgba(255,107,0,.12);
  --dim: rgba(142,142,147,.35);
  --me: #34c759;
  --tier2-soft: rgba(0,122,255,.14);
  --tier3: #a86b00;
  --tier3-soft: rgba(255,204,0,.2);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000;
    --land: #1c1c1e;
    --land-stroke: #38383a;
    --seoul: #3d2a1a;
    --seoul-stroke: #8a5a33;
    --sea: #0a0a0c;
    --label: #fff;
    --label2: rgba(235,235,245,.6);
    --label3: rgba(235,235,245,.3);
    --fill: rgba(118,118,128,.24);
    --sheet: rgba(28,28,30,.82);
    --cell: #2c2c2e;
    --sep: rgba(84,84,88,.6);
    --pin: #0a84ff;
    --season: #ff9f0a;
    --season-soft: rgba(255,159,10,.16);
    --dim: rgba(99,99,102,.45);
    --me: #30d158;
    --tier2-soft: rgba(10,132,255,.2);
    --tier3: #ffd60a;
    --tier3-soft: rgba(255,214,10,.2);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sea); color: var(--label);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
button, input { font: inherit; color: inherit; border: 0; background: none; padding: 0; }
button { cursor: pointer; }

/* ---------- map ---------- */
/* ---------- layout: 위 메뉴 / 왼쪽 지도 / 오른쪽 목록 ---------- */
#app { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) clamp(360px, 38vw, 460px); }
#mapWrap { position: relative; min-width: 0; min-height: 0; background: var(--sea); overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.zreset { position: absolute; right: 12px; bottom: 12px; height: 34px; padding: 0 13px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--pin);
  background: var(--sheet); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: 0 0 0 .5px var(--sep), 0 4px 12px rgba(0,0,0,.08);
  opacity: 0; transform: scale(.9); pointer-events: none; transition: opacity .25s, transform .35s cubic-bezier(.32,.72,0,1); }
.zreset.on { opacity: 1; transform: none; pointer-events: auto; }
.maphint { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: var(--label2); background: var(--sheet);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); padding: 6px 10px; border-radius: 999px; pointer-events: none; }
@media (max-width: 719px) {
  /* 아이폰 세로: 지도 위, 목록 아래 (겹치지 않게) */
  .main { grid-template-columns: 1fr; grid-template-rows: 48% minmax(0, 1fr); }
  .maphint { display: none; }
}
.prov { fill: var(--land); stroke: var(--land-stroke); stroke-width: .8; stroke-linejoin: round; transition: fill .3s; }
.prov.focus { fill: var(--seoul); }
.gu { fill: var(--seoul); stroke: var(--seoul-stroke); stroke-width: .6; stroke-linejoin: round; transition: fill .3s; }
.gu.focus, .muni { fill: var(--season-soft); stroke: var(--season); stroke-width: 1.2; stroke-linejoin: round; }
.muni.sub { fill: none; stroke: var(--land-stroke); stroke-width: .5; }
.plabel { font-size: 10px; font-weight: 600; fill: var(--label3); text-anchor: middle; pointer-events: none; letter-spacing: -.2px; }
.plabel.big { font-size: 13px; fill: var(--label2); }
/* 직접 확대하면 시·군·구 경계와 이름이 나타난다 */
.zoomlayer { opacity: 0; transition: opacity .3s; pointer-events: none; }
#map.zoomed .zoomlayer { opacity: 1; }
.zline { fill: none; stroke: var(--land-stroke); stroke-width: .6; stroke-linejoin: round; }
.dline { fill: none; stroke: var(--season); stroke-opacity: .4; stroke-width: .7; stroke-linejoin: round; pointer-events: none; }
.dlab { font-size: 10px; font-weight: 500; fill: var(--label2); text-anchor: middle; pointer-events: none; letter-spacing: -.3px;
  paint-order: stroke; stroke: var(--land); stroke-width: 3px; stroke-linejoin: round; }
.attr { position: absolute; left: 12px; bottom: 44px; max-width: 70%; font-size: 10px; line-height: 1.3; color: var(--label3); pointer-events: none;
  opacity: 0; transition: opacity .3s; }
#mapWrap:has(#map.dongs) .attr { opacity: 1; }
@media (max-width: 719px) { .attr { bottom: 8px; } }
.zlab { font-size: 11px; font-weight: 600; fill: var(--label2); text-anchor: middle; letter-spacing: -.2px;
  paint-order: stroke; stroke: var(--land); stroke-width: 3px; stroke-linejoin: round; }
.pin { fill: var(--pin); stroke: var(--land); stroke-width: 1; pointer-events: none; }
#gMe, #gLabels { pointer-events: none; }
.pin.season { fill: var(--season); }
.pin.off { fill: var(--dim); stroke: none; }
.pin.sel { stroke: var(--label); stroke-width: 2; }
/* 아이폰: 가까이 모인 핀은 숫자 동그라미로 묶음 (확대하면 풀림) */
.clu circle { fill: var(--pin); stroke: var(--land); stroke-width: 1.5; }
.clu.season circle { fill: var(--season); }
.clu text { fill: #fff; font-size: 11px; font-weight: 700; text-anchor: middle; pointer-events: none; font-variant-numeric: tabular-nums; }
.clu { pointer-events: none; }
.pulse { fill: none; stroke: var(--season); stroke-width: 1.5; transform-box: fill-box; transform-origin: center;
  animation: pulse 2.2s cubic-bezier(.2,.6,.3,1) infinite; pointer-events: none; }
@keyframes pulse { from { transform: scale(.6); opacity: .9; } to { transform: scale(3.4); opacity: 0; } }
.me { fill: var(--me); stroke: #fff; stroke-width: 2.5; }
.mehalo { fill: var(--me); opacity: .18; }

/* ---------- header (large title, iOS) ---------- */
header { flex: none; position: relative; z-index: 5;
  padding: calc(env(safe-area-inset-top, 0px) + 6px) 16px 10px;
  background: var(--bg); box-shadow: 0 .5px 0 var(--sep); }
/* 로고(이미지): 헤더 가운데. 아이폰은 뒤로 버튼 줄~제목 줄에 걸쳐 가운데 */
.toprow { position: relative; }
.logo { position: absolute; left: 50%; top: 2px; transform: translateX(-50%); z-index: 1; transition: transform .2s cubic-bezier(.32,.72,0,1); }
.logo:active { transform: translateX(-50%) scale(.94); }
.logo img { display: block; height: 62px; width: auto; }
.logo .lg-dark { display: none; }
@media (prefers-color-scheme: dark) { .logo .lg-light { display: none; } .logo .lg-dark { display: block; } }
@media (max-width: 719px) { #title { max-width: calc(50% - 56px); } }
@media (min-width: 720px) {
  /* 넓은 화면: 제목·검색 한 줄, 칩 두 줄 */
  .toprow { display: flex; align-items: flex-end; gap: 16px; }
  .toprow .titlewrap { flex: none; min-width: 200px; }
  .toprow .searchrow { flex: 1; max-width: min(560px, calc(50% - 180px)); margin: 0 0 4px auto; }
  .logo { top: auto; bottom: 2px; }
  .logo img { height: 68px; }
}
.crumb { font-size: 15px; color: var(--pin); font-weight: 600; height: 30px; padding: 0 12px 0 8px; margin-bottom: 4px; border-radius: 999px; background: var(--fill); display: inline-flex; align-items: center; gap: 2px;
  opacity: 0; transform: translateX(-8px); transition: opacity .3s, transform .45s cubic-bezier(.32,.72,0,1); pointer-events: none; }
.crumb.on { opacity: 1; transform: none; pointer-events: auto; }
.titlebar { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: .3px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.month { flex: none; display: flex; align-items: center; gap: 2px; background: var(--fill); border-radius: 999px; padding: 4px; margin-bottom: 4px; }
.month button { width: 26px; height: 26px; border-radius: 50%; font-size: 15px; color: var(--label2); }
.month span { font-size: 15px; font-weight: 600; min-width: 38px; text-align: center; font-variant-numeric: tabular-nums; }
.searchrow { display: flex; gap: 8px; margin-top: 8px; }
.search { flex: 1; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border-radius: 10px; background: var(--fill); }
.search svg { flex: none; opacity: .5; }
.search input { flex: 1; min-width: 0; height: 100%; font-size: 17px; outline: none; }
.search input::placeholder { color: var(--label2); }
.search .x { width: 18px; height: 18px; border-radius: 50%; background: var(--label3); color: var(--bg); font-size: 12px; line-height: 18px; text-align: center; display: none; }
.search.has .x { display: block; }
.locbtn { flex: none; height: 36px; padding: 0 12px; border-radius: 10px; background: var(--fill); font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 4px; white-space: nowrap; max-width: 38%; }
.locbtn span { overflow: hidden; text-overflow: ellipsis; }
.locbtn.on { background: rgba(52,199,89,.16); color: var(--me); }
.chips { display: flex; gap: 8px; margin: 8px -16px 0; padding: 0 16px 2px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 32px; padding: 0 13px; border-radius: 999px; font-size: 15px; font-weight: 500;
  background: var(--sheet); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  box-shadow: 0 0 0 .5px var(--sep); transition: transform .2s cubic-bezier(.32,.72,0,1), background .2s, color .2s; white-space: nowrap; }
.chip:active { transform: scale(.94); }
.chip.on { background: var(--label); color: var(--bg); box-shadow: none; }
.chip.season.on { background: var(--season); color: #fff; }
.chip.region { background: transparent; box-shadow: inset 0 0 0 1px var(--sep); -webkit-backdrop-filter: none; backdrop-filter: none; }
.chip.region.on { background: var(--pin); color: #fff; box-shadow: none; }
.chip b { font-weight: 600; opacity: .55; margin-left: 4px; font-variant-numeric: tabular-nums; }
.chip.disabled { opacity: .35; }
.vsep { flex: none; width: 1px; background: var(--sep); margin: 6px 2px; }

/* ---------- bottom sheet ---------- */
#panel { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg);
  box-shadow: -.5px 0 0 var(--sep); }
@media (max-width: 719px) { #panel { box-shadow: 0 -.5px 0 var(--sep); } }
.pages { position: relative; flex: 1; overflow: hidden; overflow: clip; padding-top: 10px; }
.page { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
  transition: transform .5s cubic-bezier(.32,.72,0,1), opacity .5s; }
.page.right { transform: translateX(100%); }
.page.left { transform: translateX(-28%); opacity: 0; pointer-events: none; }
.sheet-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 6px 2px 10px; }
.sheet-head h2 { margin: 0; font-size: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-head span { flex: none; font-size: 15px; color: var(--label2); }
.syncbtn { margin-left: 10px; height: 28px; padding: 0 11px; border-radius: 999px; background: var(--fill); color: var(--pin); font-size: 14px; font-weight: 600; }
.syncbtn.busy { color: var(--label2); }
.seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; margin: 0 0 14px; }
.seg button { flex: 1; height: 28px; border-radius: 7px; font-size: 13px; font-weight: 500; }
.seg button.on { background: var(--cell); box-shadow: 0 3px 8px rgba(0,0,0,.12); font-weight: 600; }

.group { background: var(--cell); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
.ghead { font-size: 13px; color: var(--label2); margin: 0 4px 6px; letter-spacing: .2px; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 11px 16px; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 60px; right: 0; height: .5px; background: var(--sep); }
.row:active { background: var(--fill); }
.ico { flex: none; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-size: 17px; background: var(--fill); }
.ico.season { background: var(--season-soft); }
.rmain { flex: 1; min-width: 0; }
.rname { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rsub { font-size: 13px; color: var(--label2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rhit { font-size: 13px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
mark { background: rgba(255,204,0,.35); color: inherit; border-radius: 3px; padding: 0 1px; }
.tag { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 6px;
  background: var(--season-soft); color: var(--season); margin-right: 4px; vertical-align: 1px; }
.tag.off { background: var(--fill); color: var(--label2); }
.tag.gray { background: var(--fill); color: var(--label2); font-weight: 500; }
.tag.went { background: rgba(52,199,89,.16); color: var(--me); }
.tag.went.t2, .visit.on.t2 { background: var(--tier2-soft); color: var(--pin); }
.tag.went.t3, .visit.on.t3 { background: var(--tier3-soft); color: var(--tier3); }
/* 방문 횟수 모션: 1~4 가만히 · 5~9 물결 · 10~19 빛 지나감 + 별 반짝 · 20+ 왕관 + 색 흐름 */
.tag.went .vi, .visit .vi { display: inline-block; font-style: normal; }
.tag.went.t2, .visit.on.t2 { animation: ripple 2.8s ease-out infinite; }
@keyframes ripple { 0% { box-shadow: 0 0 0 0 rgba(0,122,255,.5); } 70%, 100% { box-shadow: 0 0 0 7px rgba(0,122,255,0); } }
.tag.went.t3, .visit.on.t3, .tag.went.t4, .visit.on.t4 { position: relative; overflow: hidden; }
.tag.went.t3::after, .visit.on.t3::after, .tag.went.t4::after, .visit.on.t4::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.8) 50%, transparent 70%); transform: translateX(-130%); animation: sweep 2.6s ease-in-out infinite; }
@keyframes sweep { 55%, 100% { transform: translateX(130%); } }
.t3 .vi { animation: twinkle 2.6s ease-in-out infinite; }
@keyframes twinkle { 0%, 40%, 100% { transform: scale(1) rotate(0); } 60% { transform: scale(1.45) rotate(72deg); } }
.tag.went.t4, .visit.on.t4 { color: #fff; background: linear-gradient(90deg, #ff9500, #ff2d55, #af52de, #ff2d55, #ff9500); background-size: 250% 100%;
  animation: flow 3s ease-in-out infinite alternate, glow 2s ease-in-out infinite; }
@keyframes flow { to { background-position: 100% 0; } }
@keyframes glow { 50% { box-shadow: 0 0 12px rgba(255,45,85,.6); } }
.t4 .vi { animation: bob 1.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-2px) rotate(-10deg) scale(1.15); } }
@media (prefers-reduced-motion: reduce) {
  .tag.went, .visit.on, .tag.went .vi, .visit .vi { animation: none !important; }
  .tag.went::after, .visit.on::after { display: none; }
}
.openrow { display: flex; align-items: baseline; gap: 8px; margin: -6px 0 12px; font-size: 15px; }
.openrow b { font-weight: 600; color: var(--label2); }
.openrow.open b { color: var(--me); } .openrow.closed b { color: #ff3b30; }
.openrow span { color: var(--label2); font-variant-numeric: tabular-nums; }
.visitbox { background: var(--cell); border-radius: 12px; padding: 10px 12px; margin-bottom: 16px; }
.visitrow { display: flex; align-items: center; gap: 10px; }
.memo { display: block; width: 100%; margin-top: 10px; padding: 10px 2px 0; border: 0; border-top: .5px solid var(--sep); background: transparent;
  color: var(--label); font: inherit; font-size: 15px; line-height: 1.4; resize: none; outline: none; overflow: hidden; }
.memo::placeholder { color: var(--label3); }
.visit { height: 36px; padding: 0 16px; border-radius: 999px; background: var(--fill); font-weight: 600; font-size: 15px; transition: transform .2s cubic-bezier(.32,.72,0,1); }
.visit:active { transform: scale(.94); }
.visit.on { background: rgba(52,199,89,.16); color: var(--me); }
.visitrow small { font-size: 12px; color: var(--label2); }
.visitrow .undo { font-size: 13px; color: var(--pin); margin-left: auto; }
.nearcta { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; border-radius: 14px; margin-bottom: 20px;
  background: rgba(52,199,89,.12); }
.nearcta > span { font-size: 26px; } .nearcta b { display: block; font-size: 17px; } .nearcta small { font-size: 13px; color: var(--label2); }
.nearcta em { margin-left: auto; font-style: normal; color: var(--label3); font-size: 20px; }
.minis { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.minis > button, .minis > .mini { text-align: left; }
.mini { display: inline-flex; flex-direction: column; background: var(--cell); border-radius: 12px; padding: 8px 12px; }
.mini b { font-size: 15px; font-weight: 600; } .mini small { font-size: 12px; color: var(--label2); }
.foodhero small { display: block; }
.rt { flex: none; text-align: right; font-size: 13px; color: var(--label2); font-variant-numeric: tabular-nums; line-height: 1.3; }
.rt b { display: block; font-size: 15px; color: var(--me); font-weight: 600; }
.star { color: #ff9500; font-weight: 600; }
.chev { flex: none; color: var(--label3); font-size: 18px; }
.more { display: block; width: 100%; padding: 13px; text-align: center; color: var(--pin); font-size: 17px; }
.empty { padding: 16px; font-size: 15px; color: var(--label2); line-height: 1.45; }

/* detail */
.foodgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-bottom: 20px; }
.foodstrip { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 20px; padding: 0 16px 2px; scrollbar-width: none; }
.foodstrip::-webkit-scrollbar { display: none; }
.foodstrip .food { flex: none; width: 88px; }
.food { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 6px 10px; border-radius: 14px; background: var(--cell);
  transition: transform .2s cubic-bezier(.32,.72,0,1); }
.food:active { transform: scale(.95); }
.food .fe { font-size: 30px; line-height: 1.1; }
.food b { font-size: 15px; font-weight: 600; }
.food small { font-size: 12px; color: var(--season); font-weight: 600; }
.food.zero { opacity: .45; } .food.zero small { color: var(--label2); font-weight: 500; }
.food.on { box-shadow: inset 0 0 0 2px var(--season); }
.food { position: relative; }
.food .peak { position: absolute; top: 6px; right: 6px; font-style: normal; font-size: 10px; font-weight: 700; color: #fff; background: var(--season); padding: 1px 5px; border-radius: 5px; }
.foodhero .tip, .seasonhero .tip { margin-top: 6px; padding-top: 6px; border-top: .5px solid rgba(255,255,255,.35); }
.foodhero { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; margin-bottom: 20px; color: #fff;
  background: linear-gradient(135deg, #ff9500, #ff3b30); animation: rise .5s cubic-bezier(.32,.72,0,1) both; }
.foodhero > span { font-size: 40px; }
.foodhero b { display: block; font-size: 24px; }
.foodhero small { font-size: 13px; opacity: .9; }
.foodhero em { margin-left: auto; font-style: normal; font-size: 20px; font-weight: 700; }
.dbar { position: sticky; top: 0; z-index: 2; margin: 0 -16px 8px; padding: 4px 16px 8px; background: var(--bg); }
.back { display: flex; align-items: center; gap: 6px; width: 100%; height: 44px; padding: 0 14px; border-radius: 12px;
  background: var(--fill); color: var(--pin); font-size: 17px; font-weight: 600; }
.back:active { transform: scale(.98); opacity: .8; }
.back small { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--label2); }

<script>
(() => {
"use strict";
const $ = (s) => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const svg = $("#map");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ---------- 지역 이름 ----------
const PROV_SHORT = { "서울특별시":"서울","부산광역시":"부산","대구광역시":"대구","인천광역시":"인천","광주광역시":"광주","대전광역시":"대전","울산광역시":"울산","세종특별자치시":"세종","경기도":"경기","강원도":"강원","충청북도":"충북","충청남도":"충남","전라북도":"전북","전라남도":"전남","경상북도":"경북","경상남도":"경남","제주특별자치도":"제주" };
const SEOUL = [126.991, 37.552];
const COSLAT = Math.cos(36.5 * Math.PI / 180);
const TYPES = window.TYPES;
const TYPE = Object.fromEntries(TYPES.map((t) => [t.id, t]));

// ---------- 데이터 ----------
const places = window.PLACES;
const centroid = (polys) => {
  let best = polys[0], n = 0;
  for (const r of polys) if (r.length > n) { n = r.length; best = r; }
  let x = 0, y = 0; for (const [a, b] of best) { x += a; y += b; }
  return [x / best.length, y / best.length];
};
const provinces = window.GEO.provinces.map((f) => ({ ...f, short: PROV_SHORT[f.name] || f.name, c: centroid(f.polys) }));
const gus = window.GEO.seoul.map((f) => ({ ...f, prov: "서울", c: centroid(f.polys) }));
const munis = [...gus, ...window.GEO.munis.map((f) => ({ ...f, c: centroid(f.polys) }))];
for (const p of places) {
  // 검색용 텍스트 (이름, 업종, 유형, 메뉴, 후기 메뉴, 키워드, 주소)
  p.hay = [p.name, p.kind, p.cat, ...(p.types || []).map((t) => TYPE[t] && TYPE[t].label), ...(p.menus || []).map((m) => m.name),
    ...(p.reviewMenus || []).map((m) => m.name), ...(p.keywords || []).map((k) => k.name), p.addr].filter(Boolean).join(" ").toLowerCase();
}

// ---------- 상태 ----------
const now = new Date();
const state = {
  month: now.getMonth() + 1,
  season: false, type: null, q: "", food: null,

  // 제철 핀의 퍼지는 고리: 가게마다 하나를 만들어 두고 켜고 끄기만 한다 (새로 만들면 지도 왼쪽 위에서 깜빡이고 다 같이 다시 시작함)
  const gp = $("#gPulse"); pulses = [];
  for (const p of places) {
    const on = visible(p);
    p.on = on;
    p.el.setAttribute("class", "pin" + (!on ? " off" : p.tags.length ? " season" : "") + (p === state.selected ? " sel" : ""));
    if (on && p.tags.length && pulses.length < 60) {
      if (!p.pulse) p.pulse = el("circle", { class: "pulse", r: 4, cx: -99, cy: -99, style: `animation-delay:-${(Math.random() * 2.2).toFixed(2)}s` }, gp);
      if (p.x != null) { p.pulse.setAttribute("cx", p.x.toFixed(1)); p.pulse.setAttribute("cy", p.y.toFixed(1)); }
      p.pulse.style.display = "";
      pulses.push({ p, el: p.pulse });
    } else if (p.pulse) p.pulse.style.display = "none";
  }
  const rank = (p) => (p === state.selected ? 4 : !p.on ? 0 : p.tags.length ? 2 : 1);
  const g = $("#gPins");
  [...places].sort((a, b) => rank(a) - rank(b)).forEach((p) => g.appendChild(p.el));
  kick();
}

// ---------- 대중교통 예상 시간 (직선거리 기반 추정) ----------
function km(a, b) {
  const R = 6371, toR = Math.PI / 180;
  const dLat = (b.lat - a.lat) * toR, dLng = (b.lng - a.lng) * toR;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * toR) * Math.cos(b.lat * toR) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function transit(p) { return state.me ? estimate(state.me, p) : null; }
function estimate(from, p) {
  const d = km(from, p);
  let min, how;
  if (d < 1.2) { min = (d * 1.3) / 4.5 * 60; how = "걸어서"; }          // 도보 4.5km/h
  else if (d <= 40) { min = 12 + d * 1.35 / 24 * 60; how = "대중교통"; } // 도시 안: 걷기·대기 12분 + 평균 24km/h
  else if (d <= 150) { min = 30 + d * 1.25 / 55 * 60; how = "대중교통"; } // 광역버스·전철
  else { min = 50 + d * 1.2 / 140 * 60; how = "기차·버스"; }             // KTX/고속버스
  return { km: d, min: Math.round(min / 5) * 5 || 5, how };
}
// ---------- 영업시간 ----------
const DAYS = ["일", "월", "화", "수", "목", "금", "토"];
function hoursFor(p, d = new Date()) {
  const h = p.hours; if (!h) return null;
  const day = DAYS[d.getDay()], wk = d.getDay() >= 1 && d.getDay() <= 5;
  return h[day] || h["매일"] || (wk ? h["평일"] : h["주말"]) || null;
}
const toMin = (t) => { const [a, b] = t.split(":").map(Number); return a * 60 + b; };
function openInfo(p, d = new Date()) {
  const h = hoursFor(p, d);
  if (!h) return { known: false };
  if (!h.start) return { known: true, closed: true, text: h.note || "오늘 휴무" };
  const now = d.getHours() * 60 + d.getMinutes();
  let s0 = toMin(h.start), e0 = toMin(h.end); if (e0 <= s0) e0 += 1440;
  const n = now < s0 && e0 > 1440 && now + 1440 < e0 ? now + 1440 : now;
  const inBreak = (h.breaks || []).some(([a, b]) => a && b && n >= toMin(a) && n < toMin(b));
  return { known: true, closed: false, open: n >= s0 && n < e0 && !inBreak, inBreak, text: `${h.start}–${h.end}${h.last ? ` · 라스트오더 ${h.last}` : ""}` };
}
const closedToday = (p) => { const o = openInfo(p); return o.known && o.closed; };

// ---------- 갔다 옴 + 자주 간 유형 학습 ----------
let visits = store.get("visits") || {};          // {placeId: ["2026-11-23", …]}
const visitCount = (p) => (visits[p.id] || []).length;
const visitTier = (n) => (n >= 20 ? "t4" : n >= 10 ? "t3" : n >= 5 ? "t2" : "t1");
const visitIcon = (n) => `<i class="vi">${n >= 20 ? "👑" : n >= 10 ? "★" : "✓"}</i>`;
let notes = store.get("notes") || {};            // {placeId: "메모"}
function typePrefs() {
  const c = {}; let total = 0;
  for (const id in visits) {
    const pl = places.find((x) => x.id === id); if (!pl) continue;
    for (const t of pl.types || []) { c[t] = (c[t] || 0) + visits[id].length; total += visits[id].length; }
  }
  for (const t in c) c[t] /= total;
  return c;   // 유형별 비율 0~1
}
let prefs = typePrefs();
const prefBoost = (p) => Math.max(0, ...(p.types || []).map((t) => prefs[t] || 0));  // 0~1
function markVisit(p) {
  const today = new Date().toISOString().slice(0, 10);
  visits[p.id] = [...(visits[p.id] || []), today]; store.set("visits", visits); prefs = typePrefs();
  cloudSave("visits");
}
function undoVisit(p) {
  const arr = visits[p.id] || []; arr.pop();
  if (arr.length) visits[p.id] = arr; else delete visits[p.id];
  store.set("visits", visits); prefs = typePrefs();
  cloudSave("visits");
}

const saveTimers = {};
function cloudSave(key) {

  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(async () => {
    const { error } = await sb.from("kv").upsert({ user_id: cloudUser.id, key, value: key === "visits" ? visits : notes, updated_at: new Date().toISOString() });

// 이 기기에서 처음 로그인할 때만 합친다(방문은 가게마다 더 많이 기록된 쪽, 메모는 둘 다). 그다음부터는 클라우드가 기준.
async function cloudPull() {
  const { data, error } = await sb.from("kv").select("key,value");
  if (error) return toast("기록을 불러오지 못했어요");
  const got = Object.fromEntries((data || []).map((r) => [r.key, r.value]));
  const cv = got.visits || {}, cn = got.notes || {};
  const mergedKey = `cloudMerged:${cloudUser.id}`;
  if (!store.get(mergedKey)) {
    for (const id in visits) if (!cv[id] || visits[id].length > cv[id].length) cv[id] = visits[id];
    for (const id in notes) if (!cn[id]) cn[id] = notes[id];
    store.set(mergedKey, true);
  }
  visits = cv; notes = cn;
  store.set("visits", visits); store.set("notes", notes); prefs = typePrefs();
  cloudSave("visits"); cloudSave("notes");
  renderList(); stylePins(); if (state.selected) renderDetail(state.selected);
}

// ---------- 실제 대중교통 (네이버 경로, 중계 서버 경유) ----------
function transitProxy() {
  // 로컬은 dev_server.py 중계, 배포 사이트는 Supabase 함수 (함수는 내 사이트 주소에서 온 요청만 받는다)
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return "/api/transit";
  return (window.HANJEOM_CONFIG || {}).transitProxy || null;
}
const realCache = new Map();
// from{lat,lng} → 가게 p 실제 경로. { r, fresh }: fresh 는 이번에 네이버에 새로 물어봤는지 (간격 두기용)
async function realRoute(from, p) {
  const proxy = transitProxy(); if (!proxy) return { r: { ok: false }, fresh: false };
  const key = `${from.lng.toFixed(4)},${from.lat.toFixed(4)}>${p.id}`;
  let r = realCache.get(key);
  if (r) return { r, fresh: false };
  try {
    const res = await fetch(`${proxy}?start=${from.lng.toFixed(6)},${from.lat.toFixed(6)}&goal=${p.lng},${p.lat}`);
    r = await res.json();
  } catch { r = { ok: false }; }
  realCache.set(key, r);
  return { r, fresh: true };
}
async function loadRealTransit(p) {
  if (!transitProxy() || !state.me) return;
  const { r } = await realRoute(state.me, p);
  const box = $("#transitBox");
  if (!box || state.selected !== p || !r.ok || !r.min) return;   // 실패하면 거리 추정 그대로
  const ride = (r.steps || []).filter((x) => x.type !== "WALKING" && x.name);
  const icon = r.kind === "INTERCITY" ? "🚄" : ride.some((x) => x.type === "SUBWAY") ? "🚇" : ride.length ? "🚌" : "🚶";
  box.classList.add("real");
  box.innerHTML = `<span style="font-size:24px">${icon}</span><div><div class="big">${fmtMin(r.min)}</div>
    <small>${esc(state.me.label)}에서 · ${ride.length ? esc(ride.map((x) => (x.type === "BUS" && /^[0-9-]+$/.test(x.name) ? `${x.name}번` : x.name)).join(" → ")) : "걸어서"}${r.walk ? ` · 도보 ${r.walk}분` : ""}${r.fare ? ` · ${r.fare.toLocaleString()}원` : ""}${r.transfers ? ` · 환승 ${r.transfers}회` : ""}</small>
    <small class="src">네이버 지도 경로 기준 · 지금 출발</small></div>`;
}

const fmtMin = (m) => (m < 60 ? `${m}분` : `${Math.floor(m / 60)}시간${m % 60 ? ` ${m % 60}분` : ""}`);

// ---------- 리스트 ----------
const icon = (p) => (p.tags.length ? p.tags[0].emoji : p.types && p.types[0] && TYPE[p.types[0]] ? TYPE[p.types[0]].emoji : "🍽️");
const hl = (s) => {
  let out = esc(s);
  for (const w of state.q.split(/\s+/).filter(Boolean)) out = out.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), (m) => `<mark>${m}</mark>`);
  return out;
};
function searchHit(p) {
  if (!state.q) return "";
  const ws = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  const hit = (s) => s && ws.some((w) => s.toLowerCase().includes(w));
  const m = (p.menus || []).filter((x) => hit(x.name)).slice(0, 2);
  const r = (p.reviewMenus || []).find((x) => hit(x.name));
  const parts = [...m.map((x) => `${hl(x.name)}${x.price ? ` <span style="color:var(--label2)">${esc(x.price)}</span>` : ""}`)];
  if (r) parts.push(`후기에서 ${hl(r.name)} ${r.count}번 언급`);
  return parts.length ? `<div class="rhit">${parts.join(" · ")}</div>` : "";
}
const rowHTML = (p) => {
  const t = transit(p);
  return `
  <button class="row" data-id="${esc(p.id)}">
    <span class="ico ${p.tags.length ? "season" : ""}">${icon(p)}</span>
    <span class="rmain">
      <div class="rname">${state.q ? hl(p.name) : esc(p.name)}</div>
      <div class="rsub">${closedToday(p) ? '<span class="tag off">오늘 휴무</span>' : ""}${p.tags.map((x) => `<span class="tag">${x.emoji} ${x.key}</span>`).join("")}${visitCount(p) ? `<span class="tag went ${visitTier(visitCount(p))}">${visitIcon(visitCount(p))} ${visitCount(p)}번</span>` : ""}${p.chain ? '<span class="tag gray">체인·지점</span>' : p.main ? '<span class="tag gray">본점</span>' : ""}${p.rating ? `<span class="star">★ ${(p.wk && p.wk.avgRating || p.rating).toFixed(2)}</span> · ` : ""}${esc([p.reviewMenus && p.reviewMenus[0] ? p.reviewMenus.slice(0, 2).map((m) => m.name).join(" · ") : (p.kind || ""), p.area].filter(Boolean).join(" · "))}</div>
      ${searchHit(p)}
    </span>
    ${t ? `<span class="rt"><b>${fmtMin(t.min)}</b>${t.km.toFixed(1)}km</span>` : '<span class="chev">›</span>'}
  </button>`;

// ---------- 지도 확대/축소·이동 ----------
function setZoom(z, x, y, instant) {
  z = Math.min(12, Math.max(1, z));
  x = Math.min(0, Math.max(view.W * (1 - z), x));
  y = Math.min(0, Math.max(view.H * (1 - z), y));
  for (const [s, v] of [[uz.z, z], [uz.x, x], [uz.y, y]]) { s.t = v; if (instant) { s.v = v; s.vel = 0; } }
  $("#zoomReset").classList.toggle("on", z > 1.02);
  kick();
}
function zoomAt(cx, cy, factor, instant) {   // 화면의 (cx, cy) 지점을 붙잡은 채 배율만 바꾼다
  const z0 = uz.z.t, z1 = Math.min(12, Math.max(1, z0 * factor)), k = z1 / z0;
  setZoom(z1, cx - (cx - uz.x.t) * k, cy - (cy - uz.y.t) * k, instant);
}
svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0022)));
}, { passive: false });
$("#zoomReset").onclick = () => setZoom(1, 0, 0);

// ---------- 지도 탭 (손가락 하나: 탭·드래그, 둘: 핀치) ----------
const ptrs = new Map();
let down = null, moved = false;
svg.addEventListener("pointerdown", (e) => {
  try { svg.setPointerCapture(e.pointerId); } catch {}
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) { down = { x: e.clientX, y: e.clientY }; moved = false; } else moved = true;
});
svg.addEventListener("pointermove", (e) => {
  const prev = ptrs.get(e.pointerId); if (!prev) return;
  const r = svg.getBoundingClientRect();
  if (ptrs.size === 1) {
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) moved = true;
    if (moved && uz.z.t > 1) setZoom(uz.z.t, uz.x.t + e.clientX - prev.x, uz.y.t + e.clientY - prev.y, true);
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const other = a === prev ? b : a;
    const d0 = Math.hypot(prev.x - other.x, prev.y - other.y), d1 = Math.hypot(e.clientX - other.x, e.clientY - other.y);
    const mx0 = (prev.x + other.x) / 2, my0 = (prev.y + other.y) / 2, mx1 = (e.clientX + other.x) / 2, my1 = (e.clientY + other.y) / 2;
    setZoom(uz.z.t, uz.x.t + mx1 - mx0, uz.y.t + my1 - my0, true);
    if (d0 > 0) zoomAt(mx1 - r.left, my1 - r.top, d1 / d0, true);
  }
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
});
const endPtr = (e) => ptrs.delete(e.pointerId);
svg.addEventListener("pointercancel", (e) => { endPtr(e); moved = true; });
svg.addEventListener("pointerup", (e) => {
  endPtr(e);
  if (!down || moved || ptrs.size) return;
  const r = svg.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const t0el = document.elementFromPoint(e.clientX, e.clientY);
  // 전국 화면에서 탭은 도 선택. 단, 직접 확대해 둔 상태면 핀을 고른다
  if (state.focus.type === "home" && uz.z.t < 1.5 && t0el && t0el.dataset.prov) { select(null); return setFocus({ type: "prov", prov: t0el.dataset.prov }); }
  const cl = clusters.find((c) => Math.hypot(c.x - x, c.y - y) < cluR(c.n) + 6);
  if (cl) return zoomAt(cl.x, cl.y, 2.6);
  let best = null, bd = 18;
  for (const p of places) {
    if (!p.on || p.inCl) continue;
    const d = Math.hypot(p.x - x, p.y - y) - (p.tags.length ? 3 : 0);
    if (d < bd) { bd = d; best = p; }
  }
  if (best) return select(best);
  const t = document.elementFromPoint(e.clientX, e.clientY);
  if (t && t.dataset.area) { select(null); return setFocus({ type: "area", prov: t.dataset.prov, area: t.dataset.area }); }
  if (t && t.dataset.prov) { select(null); return setFocus({ type: "prov", prov: t.dataset.prov }); }
  if (state.selected) select(null);
});

let locAfter = null;

async function geocode(text) {
  const t = text.trim(); if (!t) return null;
  // 1) 저장한 가게 이름
  const own = places.find((p) => p.name.includes(t));
  if (own) return { lat: own.lat, lng: own.lng, label: t };
  // 2) 시군구 이름
  const m = munis.find((x) => x.name === t || x.name.startsWith(t));
  if (m) return { lat: m.c[1], lng: m.c[0], label: t };
  // 3) 동네/주소/역: 저장한 가게 주소에 나오면 그 평균 위치
  const near = places.filter((p) => p.addr.includes(t));
  if (near.length) return { lat: near.reduce((s, p) => s + p.lat, 0) / near.length, lng: near.reduce((s, p) => s + p.lng, 0) / near.length, label: t };
  // 4) 그래도 없으면 OpenStreetMap 검색 (입력한 글자만 보냄)
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&accept-language=ko&q=${encodeURIComponent(t)}`;
  const r = await fetch(url, { headers: { Accept: "application/json" } });
  const j = await r.json();
  if (j && j[0]) return { lat: +j[0].lat, lng: +j[0].lon, label: t };
  return null;
}
async function submitLoc() {
  $("#locMsg").textContent = "찾는 중…";

    const g = await geocode($("#locInput").value);
    if (g) setMe(g); else $("#locMsg").textContent = "못 찾았어요. 역 이름이나 동 이름으로 다시 해볼까요?";
  } catch { $("#locMsg").textContent = "검색에 실패했어요. 인터넷 연결을 확인해 주세요."; }
}

// ---------- 약속·투표 ----------
// 저장은 Supabase 함수(supabase/votes.sql)로만. 투표 ID(32자)를 아는 사람만 그 투표 하나를 읽고 쓴다.
// 친구는 로그인 없이 이름 + 출발지. 이 기기가 누구인지는 localStorage `vote:{id}` = {pid, token, choice}.
const VS = { id: null, data: null, timer: 0, sig: "", computing: false, prog: null, gps: null, msg: "" };
const VERR = { name_taken: "이미 있는 이름이에요. 다른 이름으로 해 주세요", full: "인원이 다 찼어요", not_gathering: "모집이 이미 끝났어요",
  not_found: "없는 약속이에요", not_voting: "지금은 투표할 수 없어요", need_two: "2명 이상 모여야 시작할 수 있어요",
  login_required: "로그인해야 만들 수 있어요", not_allowed: "이 기기에서는 할 수 없어요", no_votes: "아직 아무도 투표하지 않았어요" };

const voteLink = (id) => `${location.origin}${location.pathname}#v=${id}`;
const myEntry = (d) => { const m = store.get(`vote:${d.id}`); return m && d.people.some((u) => u.pid === m.pid) ? m : null; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const voteOn = () => $("#votePage").classList.contains("on");
// 먹고 싶은 것: 앱 검색과 같은 방식 (가게 이름·메뉴·후기 메뉴·키워드, 띄어 쓴 말은 모두 들어가야)
const wantPlaces = (want) => { const ws = String(want || "").toLowerCase().split(/\s+/).filter(Boolean); return ws.length ? places.filter((p) => ws.every((w) => p.hay.includes(w))) : places; };

function openVote(id) { history.pushState({ vote: id }, "", `#v=${id}`); showVote(id); }

// 다 모였으면 이 기기가 계산을 맡아 본다 (한 기기만 맡게 되고, 2분 넘게 멈추면 다른 기기가 이어받음)
async function maybeCompute() {
  const d = VS.data; if (!d || VS.computing) return;
  if (!myEntry(d) && !d.is_owner) return;
  const ready = (d.status === "gather" && d.people.length >= d.size && d.people.length >= 2) || (d.status === "computing" && d.computing_stale);
  if (!ready) return;
  VS.computing = true;
  try {
    const { data: mine } = await sb.rpc("claim_compute", { p_id: d.id });
    if (mine) await computeCandidates(d);
  } catch { toast("후보를 고르지 못했어요. 잠시 뒤에 다시 해 볼게요"); }
  VS.computing = false; VS.prog = null;
  loadVote();
}
async function computeCandidates(d) {
  const ppl = d.people;
  // 1) (먹고 싶은 것을 파는 곳 중) 거리로 낸 대략 시간 합 → 6곳만 남김
  const pool = (d.want && wantPlaces(d.want).length ? wantPlaces(d.want) : places).map((p) => ({ p, sum: ppl.reduce((s, u) => s + estimate(u, p).min, 0) })).sort((a, b) => a.sum - b.sum).slice(0, 6);
  // 2) 그 6곳만 실제 대중교통 경로 (네이버에 새로 물을 때마다 0.6초 쉼)
  const total = pool.length * ppl.length; let done = 0;
  VS.prog = { done, total }; renderVote(true);
  for (const c of pool) {
    c.times = {};
    for (const u of ppl) {
      const { r, fresh } = await realRoute(u, c.p);
      c.times[u.pid] = r.ok && r.min ? { min: r.min, real: true } : { min: estimate(u, c.p).min, real: false };
      VS.prog = { done: ++done, total }; renderVote(true);
      if (fresh) await sleep(600);
    }
    const ms = Object.values(c.times).map((t) => t.min);
    c.sum = ms.reduce((a, b) => a + b, 0); c.max = Math.max(...ms);
  }
  pool.sort((a, b) => a.sum - b.sum || a.max - b.max);
  const cands = pool.slice(0, 3).map(({ p, sum, times }) => ({ id: p.id, name: p.name, addr: p.addr || "", phone: p.phone || "",
    kind: p.kind || p.cat || "", area: `${p.region || ""} ${p.area || ""}`.trim(), sum, times }));
  const { error } = await sb.rpc("save_candidates", { p_id: d.id, p_cands: cands });
  if (error) throw error;
}

// 보여 주는 건 평균 이동시간 (순서는 합 기준이라 같음)
const avgMin = (c) => { const n = Object.keys(c.times || {}).length; return n ? Math.round(c.sum / n) : c.sum; };
// 좌표 → '성동구 성수1가1동' (행정동 경계로 찾고, 안 되면 가까운 시·군·구)
function inPolys(polys, x, y) {
  let inside = false;
  for (const r of polys) for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const [xi, yi] = r[i], [xj, yj] = r[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

      for (const [muni, list] of Object.entries(dongCache[prov.code]))

    } catch {}
  }
  let best = null, bd = 1e9;
  for (const m of munis) { const dd = km({ lat, lng }, { lat: m.c[1], lng: m.c[0] }); if (dd < bd) { bd = dd; best = m; } }
  return best && bd < 15 ? `${best.name} 근처` : "현재 위치";
}

      <small id="vProgTxt">${p ? `대중교통 경로 ${p.done}/${p.total}` : "한 사람 폰에서 계산 중이에요. 30초쯤 걸려요"}</small>
      ${p ? `<div class="vbar2"><i id="vProg" style="width:${(p.done / p.total) * 100}%"></i></div>` : ""}</div></div>
      ${p ? `<div class="vnote">이 화면을 닫지 말아 주세요.</div>` : ""}`;
  } else if (d.status === "voting") {
    h += `<div class="vnote">${me ? "한 곳을 골라 주세요. 모두 투표하기 전에는 바꿀 수 있어요." : "참여한 사람만 투표할 수 있어요."} 시간은 지금 출발 기준이에요.</div>`;
    h += (d.candidates || []).map((c, i) => `<div class="cand ${me && me.choice === c.id ? "mine" : ""}" style="--d:${i * 70}ms">
      <div class="ch"><span class="cn">${["🥇", "🥈", "🥉"][i] || ""} ${esc(c.name)}</span><span class="cs">평균 ${fmtMin(avgMin(c))}</span></div>
      <div class="ck">${esc([c.kind, c.area].filter(Boolean).join(" · "))}</div>
      ${ptimesHTML(d, c, me)}
      <div class="cact">${me ? `<button class="pick" data-pick="${esc(c.id)}">${me.choice === c.id ? "✓ 내 투표" : "여기로 투표"}</button>` : ""}<button class="see" data-see="${esc(c.id)}">가게 보기</button></div>
    </div>`).join("");
    h += `<div class="ghead">투표 현황</div><div class="group">${d.people.map((u) => `<div class="row vperson"><span class="ico">${esc([...u.name][0])}</span>
      <span class="rmain"><div class="rname">${esc(u.name)}${me && me.pid === u.pid ? '<span class="me">나</span>' : ""}</div></span>
      ${u.voted ? '<span class="ok">✓ 투표함</span>' : '<span class="wait">기다리는 중</span>'}</div>`).join("")}</div>`;
    h += `<button class="vbtn plain" id="vShare">🔗 링크 다시 보내기</button>`;
    const nv = d.people.filter((u) => u.voted).length;
    if (d.is_owner && nv && nv < n) h += `<button class="vbtn quiet" id="vClose2">투표 안 한 사람 빼고 지금 마감하기</button>`;
  } else {
    const cs = d.candidates || [], w = cs.find((c) => c.id === d.winner) || cs[0];
    const votesOf = (c) => d.people.filter((u) => u.choice === c.id);
    if (w) {
      h += `<div class="vwin"><small>🎉 여기로 정해졌어요 · ${votesOf(w).length}표</small><div class="wn">${esc(w.name)}</div>
        <div class="wk">${esc([w.kind, w.area].filter(Boolean).join(" · "))} · 평균 ${fmtMin(avgMin(w))}</div>${ptimesHTML(d, w, me)}</div>
        <div class="group">
          <div class="info"><span class="ii">📍</span><div class="iv"><small>주소</small><div>${esc(w.addr) || "-"}</div></div>${w.addr ? `<button class="copy" data-copy="${esc(w.addr)}">복사</button>` : ""}</div>
          <div class="info"><span class="ii">📞</span><div class="iv"><small>전화번호</small><div>${w.phone ? `<a href="tel:${esc(w.phone)}">${esc(w.phone)}</a>` : "정보 없음"}</div></div>${w.phone ? `<button class="copy" data-copy="${esc(w.phone)}">복사</button>` : ""}</div>
        </div>
        <button class="vbtn plain" data-see="${esc(w.id)}">메뉴·후기 보기</button>
        <button class="vbtn plain" id="vShare">🔗 결과 링크 보내기</button>`;
      const others = cs.filter((c) => c !== w);
      if (others.length) h += `<div class="ghead" style="margin-top:22px">다른 후보</div>${others.map((c) => `<div class="cand"><div class="ch"><span class="cn">${esc(c.name)}</span><span class="cs">평균 ${fmtMin(avgMin(c))}</span></div>
        <div class="ck">${esc([c.kind, c.area].filter(Boolean).join(" · "))}</div><div class="cvotes"><b>${votesOf(c).length}표</b>${votesOf(c).length ? " · " + votesOf(c).map((u) => esc(u.name)).join(", ") : ""}</div></div>`).join("")}`;
      const none = d.people.filter((u) => !u.choice);
      h += `<div class="vnote" style="margin-top:12px">${esc(w.name)}에 투표: ${votesOf(w).map((u) => esc(u.name)).join(", ") || "-"}${none.length ? `<br>투표 안 함: ${none.map((u) => esc(u.name)).join(", ")}` : ""}</div>`;
    }
  }
  $("#vBody").innerHTML = h;
  if (keep.name != null && $("#vName")) $("#vName").value = keep.name;
  else if ($("#vName") && store.get("voteName")) $("#vName").value = store.get("voteName");
  if (keep.loc != null && $("#vLoc")) $("#vLoc").value = keep.loc;
  else if ($("#vLoc") && state.me) { $("#vLoc").value = state.me.label; VS.gps = state.me; }
  if (keep.focus && $("#" + keep.focus)) $("#" + keep.focus).focus();
}
function vmsg(t) { VS.msg = t; const m = $("#vMsg"); if (m) m.textContent = t; }
async function joinVote() {
  const d = VS.data, name = $("#vName").value.trim(), loc = $("#vLoc").value.trim();
  if (!name) return vmsg("이름을 넣어 주세요");
  if (!loc) return vmsg("출발지를 넣어 주세요");
  let g = VS.gps && VS.gps.label === loc ? VS.gps : null;
  if (!g) {
    vmsg("출발지 찾는 중…");
    try { g = await geocode(loc); } catch { g = null; }
    if (!g) return vmsg("출발지를 못 찾았어요. 역 이름이나 동 이름으로 해 볼까요?");
  }
  if (g.lat < 33 || g.lat > 39 || g.lng < 124 || g.lng > 132) return vmsg("국내 출발지만 돼요");
  if (g.label === "현재 위치") g = { ...g, label: (await placeName(g.lat, g.lng)).slice(0, 40) };
  vmsg("참여하는 중…");
  const { data, error } = await sb.rpc("join_vote", { p_id: d.id, p_name: name, p_label: String(g.label).slice(0, 40), p_lat: g.lat, p_lng: g.lng });
  if (error) return vmsg(verr(error));
  store.set(`vote:${d.id}`, { pid: data.pid, token: data.token });
  store.set("voteName", name);
  VS.msg = ""; toast("참여했어요");
  loadVote();
}
async function shareVote() {
  const url = voteLink(VS.data.id);
  // 메시지 없이 링크만 (카톡 미리보기는 og 태그 + og.png)
  if (navigator.share && matchMedia("(pointer: coarse)").matches) {
    try { await navigator.share({ url }); return; } catch (e) { if (e && e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(url); toast("링크를 복사했어요. 카톡에 붙여 넣으세요"); } catch { window.prompt("이 링크를 복사해 보내 주세요", url); }
}
function peekPlace(id) {
  const p = places.find((x) => x.id === id);
  if (!p) return toast("지금 지도에 없는 가게예요");
  hideVote(true); select(p);
}
$("#vBody").addEventListener("click", async (e) => {
  const t = e.target, d = VS.data;
  if (t.closest("#vClose")) return closeVote();
  if (!d) return;
  if (t.id === "vJoin") return joinVote();
  if (t.id === "vShare") return shareVote();
  if (t.id === "vGps") {
    if (!navigator.geolocation) return vmsg("이 브라우저는 위치를 지원하지 않아요. 출발지를 직접 넣어 주세요");
    vmsg("위치 확인 중…");
    return navigator.geolocation.getCurrentPosition(async (pos) => {
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      const label = (await placeName(lat, lng)).slice(0, 40);
      VS.gps = { lat, lng, label };
      if ($("#vLoc")) $("#vLoc").value = label;
      vmsg(`📍 ${label}(으)로 정했어요. 참여하기를 눌러 주세요`);
    }, (err) => vmsg(err && err.code === 1 ? "위치 권한이 꺼져 있어요. 설정에서 켜거나 출발지를 직접 넣어 주세요"
        : "위치를 찾지 못했어요. 출발지를 직접 넣어 주세요"),
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  }
  if (t.id === "vLeave") {
    const m = myEntry(d); if (!m || !confirm("이 약속에서 빠질까요?")) return;
    const { error } = await sb.rpc("leave_vote", { p_id: d.id, p_pid: m.pid, p_token: m.token });
    if (error) return toast(verr(error));
    store.set(`vote:${d.id}`, null); return loadVote();
  }
  if (t.id === "vClose2") {
    const none = d.people.filter((u) => !u.voted).map((u) => u.name).join(", ");
    if (!confirm(`${none} 님은 빼고 지금까지 들어온 표로 마감할까요?`)) return;
    const { data, error } = await sb.rpc("close_now", { p_id: d.id });
    if (error) return toast(verr(error));
    if (data) { VS.data = data; renderVote(); }
    return toast("🎉 마감했어요");
  }
  if (t.id === "vStart") {
    const { error } = await sb.rpc("start_now", { p_id: d.id });
    if (error) return toast(verr(error));
    return loadVote();
  }
  const pk = t.closest("[data-pick]");
  if (pk) {
    const m = myEntry(d); if (!m) return;
    const { data, error } = await sb.rpc("cast_vote", { p_id: d.id, p_pid: m.pid, p_token: m.token, p_choice: pk.dataset.pick });
    if (error) return toast(verr(error));
    store.set(`vote:${d.id}`, { ...m, choice: pk.dataset.pick });
    if (data) { VS.data = data; renderVote(); }
    toast(data && data.status === "closed" ? "🎉 모두 투표했어요" : "✓ 투표했어요");
    return;
  }
  const see = t.closest("[data-see]"); if (see) return peekPlace(see.dataset.see);
  const c = t.closest("[data-copy]");
  if (c) { try { await navigator.clipboard.writeText(c.dataset.copy); toast("복사했어요"); } catch { toast("복사하지 못했어요"); } }
});
$("#vBody").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  if (e.target.id === "vName") $("#vLoc").focus();
  if (e.target.id === "vLoc") joinVote();
});
$("#vBody").addEventListener("input", (e) => { if (e.target.id === "vLoc" && VS.gps && e.target.value !== VS.gps.label) VS.gps = null; });

// 약속 만들기 (로그인한 나만)
let vSize = 4;
const VSTAT = { gather: "모으는 중", computing: "후보 고르는 중", voting: "투표 중", closed: "끝남" };
async function openVoteNew() {
  if (!cloudUser) return openAuth();
  $("#vNewMsg").textContent = ""; wantHint(); $("#vSize").textContent = `${vSize}명`; $("#vRecent").innerHTML = "";
  $("#voteModal").classList.add("on");
  const { data } = await sb.rpc("my_votes");
  if (data && data.length) $("#vRecent").innerHTML = `<div class="ghead" style="margin-top:18px">최근 약속</div><div class="group">${data.slice(0, 5).map((v) => `
    <button class="row" data-vote="${esc(v.id)}"><span class="rmain"><div class="rname">${esc(v.title)}</div><div class="rsub">${v.want ? `${esc(v.want)} · ` : ""}${VSTAT[v.status]} · ${v.n}/${v.size}명 · ${new Date(v.created_at).toLocaleDateString("ko-KR")}</div></span><span class="chev">›</span></button>`).join("")}</div>`;
}
const closeVoteNew = () => $("#voteModal").classList.remove("on");
function wantHint() {
  const w = $("#vWant").value.trim(), n = w ? wantPlaces(w).length : 0, h = $("#vWantHint");
  h.textContent = !w ? `저장한 ${places.length}곳 전체에서 골라요` : n ? `${w} 파는 곳 ${n}곳 중에서 골라요` : `저장한 곳 중에 ${w} 파는 곳이 없어요`;
  h.classList.toggle("none", !!w && !n);
}
$("#vWant").addEventListener("input", wantHint);
$("#voteDim").onclick = closeVoteNew;
$("#vMinus").onclick = () => { vSize = Math.max(2, vSize - 1); $("#vSize").textContent = `${vSize}명`; };
$("#vPlus").onclick = () => { vSize = Math.min(12, vSize + 1); $("#vSize").textContent = `${vSize}명`; };
$("#vRecent").addEventListener("click", (e) => { const r = e.target.closest("[data-vote]"); if (r) { closeVoteNew(); openVote(r.dataset.vote); } });
$("#vCreate").onclick = async () => {
  const want = $("#vWant").value.trim();
  if (want && !wantPlaces(want).length) return ($("#vNewMsg").textContent = `저장한 곳 중에 ${want} 파는 곳이 없어요. 다른 말로 써 볼까요?`);
  const title = $("#vTitle").value.trim() || (want ? `${want} 먹는 날` : `${state.month}월 약속`);
  $("#vNewMsg").textContent = "만드는 중…";
  const { data, error } = await sb.rpc("create_vote", { p_title: title, p_size: vSize, p_want: want || null });
  if (error) return ($("#vNewMsg").textContent = verr(error));
  $("#vTitle").value = ""; $("#vWant").value = ""; closeVoteNew(); openVote(data);
  toast("링크를 만들었어요. 나도 출발지를 넣어 주세요");
};

// ---------- 레이아웃: 지도 영역 크기에 맞춰 그린다 ----------
let cur = "full";
function snap() {}               // (예전 바텀시트용, 지금은 목록이 따로 있어서 할 일 없음)
function layout() {
  const r = $("#mapWrap").getBoundingClientRect();
  view = { W: r.width, H: r.height, top: 0, bottom: r.height };
  svg.setAttribute("viewBox", `0 0 ${r.width} ${r.height}`);
  kick();
}
new ResizeObserver(layout).observe($("#mapWrap"));

// ---------- 토스트 ----------
let tt = 0;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2200); }

// ---------- 시작 ----------
addEventListener("resize", layout);
$("#mTxt").textContent = state.month + "월";
if (state.me) { $("#locTxt").textContent = state.me.label; $("#locBtn").classList.add("on"); }
refresh(); layout();
syncPoll();
// 투표 링크(#v=…)로 들어왔으면 투표 화면부터
function voteFromHash() {
  const m = location.hash.match(/^#v=([0-9a-f]{32})$/);
  if (m && m[1] !== VS.id) { history.replaceState({ vote: m[1], root: true }, "", location.hash); showVote(m[1]); }
}
voteFromHash();
addEventListener("hashchange", voteFromHash);
// 첫 화면 '내 주변 지금 갈 만한 곳': 위치 권한을 이미 줬으면 바로 현재 위치로
try {
  navigator.permissions && navigator.permissions.query({ name: "geolocation" }).then((r) => { if (r.state === "granted") useGps(true); }).catch(() => {});
} catch {}
setTimeout(() => { const n = places.filter((p) => p.tags.length).length; if (n && !voteOn()) toast(`🔥 ${state.month}월 제철 맛집 ${n}곳`); }, 2200);
})();
</script>
